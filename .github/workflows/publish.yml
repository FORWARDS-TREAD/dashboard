name: Render and Deploy Dashboard

on:
  repository_dispatch:
    types: ['data-updated-event']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4

      - name: Fetch data repository
        uses: actions/checkout@v4
        with:
          repository: 'FORWARDS-TREAD/stations_data'
          path: 'data'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev

      - name: Install R Packages
        run: |
          install.packages(
            c("rmarkdown", "knitr", "leaflet", "sf", "terra", "geodata", "dplyr", "ggplot2", "RColorBrewer", "stringr", "DT", "rgbif", "wdpar", "lubridate", "crosstalk", "jsonlite", "arrow"),
            repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest"
          )
        shell: Rscript {0}

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
